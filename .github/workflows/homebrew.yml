name: Published Homebrew install
on:
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - "scripts/update-cask.py"
      - "scripts/test-homebrew.sh"
      - "scripts/verify-app.py"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify the published app without starting a service
        run: bash scripts/test-homebrew.sh
