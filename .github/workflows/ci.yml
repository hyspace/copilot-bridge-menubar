name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - name: Verify architecture and install locked build dependencies
        run: |
          test "$(uname -m)" = arm64
          cd vendor/copilot-bridge
          bun install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          bun vendor/copilot-bridge/node_modules/typescript/bin/tsc --noEmit
          bun test backend
          (cd vendor/copilot-bridge && bun test)
          python3 scripts/test-cask.py
          swift test --disable-sandbox
      - name: Backend and isolated integration tests
        run: |
          python3 scripts/build-backend.py
          python3 scripts/test-auth.py
          python3 scripts/integration-test.py
          (cd vendor/copilot-bridge && bun run test:http)
      - name: Build and verify standalone app
        run: |
          bash scripts/build-app.sh
          python3 scripts/verify-app.py --app "build/Copilot Bridge.app" --version 0.1.0
          CBM_TEST_BINARY="$PWD/build/Copilot Bridge.app/Contents/Resources/copilot-bridge-service" python3 scripts/integration-test.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Copilot-Bridge-arm64
          path: |
            build/Copilot-Bridge-arm64.zip
            build/SHA256SUMS
          retention-days: 7
